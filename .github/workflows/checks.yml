name: run unit tests and linter

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/viamrobotics/rdk-devenv:amd64
    steps:
    - name: Checkout code
      # actions/checkout@v7.0.1
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Dependencies
      run: make setup
    - name: Run linter
      run: make lint
    - name: Run unit tests
      run: make test
